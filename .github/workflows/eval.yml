name: Eval

# Manual only: calls your live backend (uses real Groq/Tavily quota, 3 research runs by default).
# Actions tab -> Eval -> Run workflow. Results appear in the run summary and as an artifact.
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Backend base URL
        default: https://researchmind-q4fp.onrender.com
      limit:
        description: Number of topics (3 fits the Groq free tier; up to 8 on a paid plan)
        default: "3"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run eval
        run: python eval/run_eval.py --base-url "${{ inputs.backend_url }}" --limit "${{ inputs.limit }}"
      - name: Publish summary
        if: always()
        run: cat eval/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
